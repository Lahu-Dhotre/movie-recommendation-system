<!-- Movie List Page Content -->

  <div class="netflix-header">
    <span class="netflix-title mj-red">   MJ</span>
    <span *ngIf="selectedUser" class="greeting">Hi, {{ selectedUser.name }}!</span>
    <button class="signout-btn" (click)="signOut()">Sign out</button>
  </div>
  <div class="movie-section-title">Top 5 Picks for You</div>
  <div class="movie-row">
    <div class="movie-card" *ngFor="let topPick of topPicks">
      <div class="poster-container">
        <div class="poster-img-wrapper">
          <img mat-card-image [src]="topPick.poster_url" [alt]="topPick.title" style="width: 100%; height: 100%; object-fit: contain;" />
        </div>
      </div>
      <div class="movie-info" style="display: flex; flex-direction: column; justify-content: space-between; height: 200px;">
    <div class="movie-title">{{ topPick.title }}</div>
    <div class="movie-info">{{ topPick.overview }}</div>
    <div class="button-row" style="display: flex; justify-content: space-between; margin-top: 16px;">
      <button mat-icon-button color="accent" class="play-btn-inline" style="background-color: #f0f0f0; border-radius: 8px; padding: 10px;">
        <i class="fa-solid fa-play fa-2xs"></i>
      </button>
      <div style="display: flex; gap: 8px;">
        <button mat-icon-button color="accent" class="play-btn-inline" style="background-color: darkgray; border-radius: 2px; padding: 10px;">
          <i class="fa-solid fa-heart fa-beat"></i>
        </button>
        <button mat-icon-button color="accent" class="play-btn-inline" style="background-color: darkgray; border-radius: 2px; padding: 10px;">
          <i class="fa-solid fa-thumbs-up"></i>
        </button>
        <button mat-icon-button color="accent" class="play-btn-inline" style="background-color: yellow; border-radius: 2px; padding: 10px;">
          <i class="fa-sharp fa-solid fa-thumbs-down"></i>
        </button>
      </div>
  </div>
</div>
    </div>
  </div>

  <div class="movie-section-title" >Movies to Watch</div>
  <div class="movie-row">
    <div class="movie-card" *ngFor="let movie of moviesToWatch">
      <div class="poster-container">
        <div class="poster-img-wrapper">
          <img mat-card-image [src]="movie.poster_url" [alt]="movie.title" style="width: 100%; height: 100%; object-fit: contain;" />
        </div>
      </div>
      <div class="movie-info" style="display: flex; flex-direction: column; justify-content: space-between; height: 200px;">
        <div class="movie-title">{{ movie.title }}</div>
        <div class="movie-info">{{ movie.overview }}</div>
        <div class="button-row" style="display: flex; justify-content: space-between;">
          <button mat-icon-button color="accent" class="play-btn-inline" style="background-color: #f0f0f0; border-radius: 8px; padding: 10px;">
            <i class="fa-solid fa-play fa-2xs"></i>
          </button>
          <div class="button-row" style="display: flex; justify-content: flex-end; gap: 1px;">
            <button mat-icon-button color="accent" class="play-btn-inline" style="background-color: darkgray; border-radius: 2px; padding: 10px;" (click)="addRating(movie.movie_id, 2)">
              <i class="fa-solid fa-heart fa-beat"></i>
            </button>
            <button mat-icon-button color="accent" class="play-btn-inline" style="background-color: darkgray; border-radius: 2px; padding: 10px;" (click)="addRating(movie.movie_id, 2)">
              <i class="fa-solid fa-thumbs-up"></i>
            </button>
            <button mat-icon-button color="accent" class="play-btn-inline" style="background-color: yellow; border-radius: 2px; padding: 10px;" (click)="addRating(movie.movie_id, 1)">
              <i class="fa-sharp fa-solid fa-thumbs-down"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
